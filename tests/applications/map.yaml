---
name: "map"
config:
  resource_hints: []
  airflow:
    schedule: "@daily"
nodes:
  - task:
      id: "t_1"
      description: "The first task of the application."
      task_config: {}           # using Airflow EmptyOperator
      depends_on: []
  - map:
      id: "map_1"
      items: "$t_1"             # list
      body:
        - task:
            id: "t_2"
            task_config: {}
            depends_on: []
        - task:
            id: "t_3"
            task_config: {}
            depends_on:
              - "t_2"
      depends_on:
        - "t_1"
  - task:
      id: "t_4"
      task_config: {}
      depends_on:
        - "map_1"
