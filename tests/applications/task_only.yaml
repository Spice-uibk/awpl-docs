---
name: "taskOnly"
runtime: "airflow"
config:
  resource_hints: []
  slo: []
  runtime:
    schedule: "@daily"
nodes:
  - task:
      id: "t_1"
      description: "The first task of the application."
      task_config: {}           # using Airflow EmptyOperator
      depends_on: []
  - task:
      id: "t_2"
      task_config: {}
      depends_on:
        - "t_1"
  - task:
      id: "t_3"
      task_config: {}
      depends_on:
        - "t_1"
  - task:
      id: "t_4"
      task_config: {}
      depends_on:
        - "t_3"
  - task:
      id: "t_5"
      task_config: {}
      depends_on:
        - "t_2"
        - "t_4"
